<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet" />

    <style>
        body{
            background: transparent;
            margin: 0;
            text-align: center;
            font-family: monospace;
            background-color: #fff;
            margin-top: 80px;
        }

        .box{
            display: inline-block;
            padding: 10px;
            min-width: 70px;
            height: 60px;
            border: 3px solid #000000;
            border-radius: 5px;
            box-shadow: 2px 2px 1px 0px #000000;
            margin: 5px;
            background-color: #f3fff3;
        }

        h2{
            display: inline-block;
            margin: 0;
            font-size: 28px;
        }

        h3{
            text-align: left;
            display: inline-block;
            margin-left: 10px;
            font-size: 20px;
        }

        .small{
            font-size: 14px;
            font-weight: lighter;
        }

        #title{
            font-family: 'Fjalla One', sans-serif;
            margin-bottom: 30px;
        }
        
        #counter{
            transform: scale(0.9);
        }
    </style>
</head>

<body>

    <h1 id="title">Countdown to D-Day</h1>

    <div id="counter">
        <h2 class="box" id="days"></h2>
        <h2 class="box" id="hours"></h2>
        <h2 class="box" id="minutes"></h2>
        <h2 class="box" id="seconds"></h2>

        <h3>
            Left Until <br> D-Day
        </h3>
    </div>

<script>

    // SET YOUR D-DAY DATE HERE
    const dday = new Date("2026-08-01T00:00:00");

    const left_days = document.getElementById("days");
    const left_hours = document.getElementById("hours");
    const left_minutes = document.getElementById("minutes");
    const left_seconds = document.getElementById("seconds");

    function showRemaining() {

        const now = new Date();

        const distance = dday - now;

        // If countdown is over
        if (distance <= 0) {
            document.getElementById("counter").innerHTML = `
                <h1>D-Day Has Arrived 🎉</h1>
            `;
            clearInterval(timer);
            return;
        }

        // Time calculations
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));

        const hours = Math.floor(
            (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );

        const minutes = Math.floor(
            (distance % (1000 * 60 * 60)) / (1000 * 60)
        );

        const seconds = Math.floor(
            (distance % (1000 * 60)) / 1000
        );

        left_days.innerHTML =
            days + "<br><span class='small'>days</span>";

        left_hours.innerHTML =
            hours + "<br><span class='small'>hours</span>";

        left_minutes.innerHTML =
            minutes + "<br><span class='small'>mins</span>";

        left_seconds.innerHTML =
            seconds + "<br><span class='small'>secs</span>";
    }

    showRemaining();

    const timer = setInterval(showRemaining, 1000);

</script>

</body>
</html>
